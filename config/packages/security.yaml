security:

    password_hashers:
        App\Entity\User:
            algorithm: bcrypt
            cost: 12
        App\Entity\Admin:
            algorithm: bcrypt
            cost: 13

    providers:
        user_provider:
            entity:
                class: App\Entity\User
                property: phone

        admin_provider:
            entity:
                class: App\Entity\Admin
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Routes login User — pas de JWT requis
        api_user_login:
            pattern: ^/api/auth/(login|register|refresh)$
            stateless: true
            security: false

        # Tracking visiteurs — pas de JWT requis (appelé par le frontend public)
        api_track:
            pattern: ^/api/track$
            stateless: true
            security: false

        # Routes login Admin — pas de JWT requis
        api_admin_login:
            pattern: ^/api/admin/auth/(login|activate|refresh)$
            stateless: true
            security: false

        # Toutes les routes /api/admin/* — JWT Admin
        api_admin:
            pattern: ^/api/admin
            stateless: true
            provider: admin_provider
            jwt: ~

        # Toutes les routes /api/* — JWT User
        api_user:
            pattern: ^/api
            stateless: true
            provider: user_provider
            jwt: ~

    access_control:
        # Auth User — public
        - { path: ^/api/auth/login,    roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/logout,  roles: ROLE_USER }

        # Auth Admin — public
        - { path: ^/api/admin/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin/auth/activate, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin/auth/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin/auth/logout, roles: ROLE_ADMIN }

        # Catalogue en lecture — public
        - { path: ^/api/categories, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/products,   roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/banners,    roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/reviews/\d+/helpful, roles: PUBLIC_ACCESS, methods: [POST] }

        # Tracking visiteurs — public (frontend React sans connexion)
        - { path: ^/api/track, roles: PUBLIC_ACCESS, methods: [POST, OPTIONS] }


        # Admin — nécessite ROLE_ADMIN
        - { path: ^/api/admin, roles: ROLE_ADMIN }

        # Tout le reste — nécessite ROLE_USER
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
            App\Entity\Admin:
                algorithm: auto
                cost: 4